name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: me.sjcl.gripblink
  ASSET_NAME: GripBlink

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Check version
        id: ver
        run: |
          version=$(jq -r .version package.json)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "package.json version ($version) does not match tag (${GITHUB_REF_NAME})" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          zip -r "${ASSET_NAME}-v${{ steps.ver.outputs.version }}.zip" \
            Editor Editor.meta Runtime Runtime.meta \
            package.json package.json.meta LICENSE LICENSE.meta

      - name: Build unitypackage installer
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          VPM_REPO_URL: ${{ vars.VPM_REPO_URL }}
        run: |
          if [ -z "$VPM_REPO_URL" ]; then
            echo "VPM_REPO_URL is not configured" >&2
            exit 1
          fi

          # Generate installer configuration
          jq -n \
            --arg repo "$VPM_REPO_URL" \
            --arg package "$PACKAGE_NAME" \
            --arg version "$VERSION" \
            '{
              vpmRepositories: [$repo],
              vpmDependencies: {($package): $version},
              minimumUnity: "2022.3"
            }' > installer-config.json

          # Download pinned VPMPackageAutoInstaller Creator
          curl -fLsS --retry 3 \
            https://github.com/anatawa12/VPMPackageAutoInstaller/releases/download/v1.1.6/creator.mjs \
            -o creator.mjs

          # Generate unitypackage
          node creator.mjs \
            installer-config.json \
            "${ASSET_NAME}-v${VERSION}.unitypackage"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${ASSET_NAME}-v${{ steps.ver.outputs.version }}.zip" \
            "${ASSET_NAME}-v${{ steps.ver.outputs.version }}.unitypackage" \
            --draft --verify-tag --title "${GITHUB_REF_NAME}" --notes ""
